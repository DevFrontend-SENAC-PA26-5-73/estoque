name: Build e push imagem Docker (tag latest)

# Dispara quando um PR mergeado na branch main
on:
  push:
    branches:
      - main

jobs:
  docker-latest:
    runs-on: ubuntu-latest

    # Executa apenas se o ator do evento for um Tech Lead.
    # Substitua os nomes abaixo pelos usuários GitHub dos Tech Leads.
    if: >
      github.actor == 'adryan-py' ||
      github.actor == 'EdersonTenorio' ||
      github.actor == 'rafaelfz254-cpu' ||
      github.actor == 'TheParousia'

    permissions:
      contents: read

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem com tag latest
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Substitua 'seu-usuario' pelo seu usuário/organização do Docker Hub
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/estoque:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
